name: learnflow

x-mysql-common: &mysql-common
  image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
  restart: unless-stopped
  command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    - --default-time-zone=+00:00
    - --innodb-lock-wait-timeout=5
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent',
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  mysql-dev:
    <<: *mysql-common
    profiles: [dev]
    environment:
      MYSQL_DATABASE: ${MYSQL_DEV_DATABASE:?MYSQL_DEV_DATABASE is required}
      MYSQL_USER: ${MYSQL_DEV_USER:?MYSQL_DEV_USER is required}
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:?MYSQL_DEV_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?MYSQL_DEV_ROOT_PASSWORD is required}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - learnflow-dev-mysql:/var/lib/mysql

  mysql-test:
    <<: *mysql-common
    profiles: [test]
    restart: 'no'
    environment:
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:?MYSQL_TEST_DATABASE is required}
      MYSQL_USER: ${MYSQL_TEST_USER:?MYSQL_TEST_USER is required}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?MYSQL_TEST_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?MYSQL_TEST_ROOT_PASSWORD is required}
    ports:
      - '127.0.0.1:3308:3306'
    volumes:
      - learnflow-test-mysql:/var/lib/mysql

volumes:
  learnflow-dev-mysql:
    name: learnflow-dev-mysql
  learnflow-test-mysql:
    name: learnflow-test-mysql
