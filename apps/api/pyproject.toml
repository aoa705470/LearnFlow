[project]
name = "learnflow-api"
version = "0.1.0"
description = "LearnFlow local API"
requires-python = "==3.13.14"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pymysql[rsa]==1.2.3",
  "sqlalchemy==2.1.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "mysql: requires the isolated LearnFlow MySQL test instance",
]
